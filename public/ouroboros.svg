<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="scaleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6c875" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c9a961" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6b4d1f" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b876"/>
      <stop offset="50%" stop-color="#a68748"/>
      <stop offset="100%" stop-color="#6b4d1f"/>
    </linearGradient>
    <pattern id="scales" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M 7 0 Q 14 7 7 14 Q 0 7 7 0 Z" fill="none" stroke="#3a2810" stroke-width="0.6" opacity="0.7"/>
      <path d="M 0 7 Q 7 0 14 7" fill="none" stroke="#5a3d18" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <mask id="ringMask">
      <circle cx="200" cy="200" r="155" stroke="white" stroke-width="58" fill="none"/>
    </mask>
  </defs>

  <!-- Outer halo -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#c9a961" stroke-width="0.5" opacity="0.3"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#c9a961" stroke-width="0.3" opacity="0.2"/>

  <!-- Snake body ring (base) -->
  <g>
    <circle cx="200" cy="200" r="155" stroke="url(#bodyGrad)" stroke-width="58" fill="none"/>
    <circle cx="200" cy="200" r="155" stroke="url(#scaleGrad)" stroke-width="56" fill="none" opacity="0.6"/>
    <!-- Scale pattern overlay constrained to the ring -->
    <rect x="0" y="0" width="400" height="400" fill="url(#scales)" mask="url(#ringMask)"/>
    <!-- Inner shadow on the ring -->
    <circle cx="200" cy="200" r="128" stroke="#1a0e05" stroke-width="3" fill="none" opacity="0.5"/>
    <circle cx="200" cy="200" r="182" stroke="#1a0e05" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- Head: positioned at top, biting the tail which curves in from the right -->
  <g transform="translate(200 45)">
    <!-- Head shape, pointing left-down, opening jaw to bite tail coming from below-right -->
    <g transform="rotate(-20)">
      <!-- Lower jaw -->
      <path d="M 0 8 Q 28 12 42 18 Q 36 22 28 22 Q 14 22 0 16 Z" fill="url(#bodyGrad)" stroke="#3a2810" stroke-width="1"/>
      <!-- Upper head -->
      <path d="M -8 -12 Q 10 -18 30 -14 Q 46 -10 50 0 Q 48 8 42 12 Q 28 6 0 4 Q -8 -2 -8 -12 Z" fill="url(#bodyGrad)" stroke="#3a2810" stroke-width="1.2"/>
      <!-- Head scale detail -->
      <path d="M -4 -8 Q 8 -12 22 -10" fill="none" stroke="#3a2810" stroke-width="0.5" opacity="0.6"/>
      <path d="M 0 -2 Q 14 -4 32 0" fill="none" stroke="#3a2810" stroke-width="0.5" opacity="0.6"/>
      <!-- Eye -->
      <ellipse cx="14" cy="-4" rx="3.5" ry="2.5" fill="#1a0a05"/>
      <ellipse cx="14.5" cy="-4.5" rx="1" ry="0.8" fill="#e6c875"/>
      <!-- Fang -->
      <path d="M 28 8 L 30 18 L 32 8 Z" fill="#e8d9b0"/>
      <path d="M 36 10 L 38 17 L 40 10 Z" fill="#e8d9b0"/>
    </g>
  </g>

  <!-- Tail being bitten — small triangle at the mouth area -->
  <g transform="translate(232 52) rotate(35)">
    <path d="M 0 0 L 14 -4 L 18 0 L 14 4 Z" fill="url(#bodyGrad)" stroke="#3a2810" stroke-width="0.8"/>
  </g>

  <!-- Center sigil — alchemical symbol -->
  <g opacity="0.5" transform="translate(200 200)">
    <circle r="60" fill="none" stroke="#c9a961" stroke-width="0.6"/>
    <circle r="42" fill="none" stroke="#c9a961" stroke-width="0.4"/>
    <!-- Triangle (fire) -->
    <path d="M 0 -38 L 33 19 L -33 19 Z" fill="none" stroke="#c9a961" stroke-width="0.8" opacity="0.7"/>
    <!-- Inverted triangle (water) -->
    <path d="M 0 38 L 33 -19 L -33 -19 Z" fill="none" stroke="#6b1f1f" stroke-width="0.6" opacity="0.6"/>
    <!-- Center dot -->
    <circle r="3" fill="#c9a961"/>
    <circle r="1.2" fill="#1a0a05"/>
  </g>
</svg>
